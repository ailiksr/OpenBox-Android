name: Build & Release OpenBox Android Module

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js & pnpm
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install Panel Server Dependencies
        run: |
          # node_modules 不再入库，必须在打包前装入运行依赖，
          # 否则 Release zip 里的面板会因 import express/ws/yaml 失败而无法启动。
          cd panel/server
          pnpm install --prod
          # 硬校验：缺任何一个运行依赖都直接让流水线失败，绝不产出半残的包
          for dep in express ws yaml; do
            if [ ! -d "node_modules/$dep" ]; then
              echo "::error::运行依赖 $dep 缺失，打包会产出无法启动的面板"
              exit 1
            fi
          done
          echo "运行依赖校验通过："
          du -sh node_modules

      - name: Download Precompiled Binaries
        run: |
          mkdir -p bin node/bin node/lib
          
          # 1. Download official statically compiled sing-box
          SINGBOX_VER="1.14.0"
          echo "Downloading sing-box v${SINGBOX_VER}..."
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${SINGBOX_VER}/sing-box-${SINGBOX_VER}-linux-arm64-musl.tar.gz" -o singbox.tar.gz
          tar -xzf singbox.tar.gz
          mv sing-box-*/sing-box bin/sing-box
          chmod +x bin/sing-box
          rm -rf sing-box-* singbox.tar.gz

          # 2. Download musl Node.js aarch64 runtime
          NODE_VER="24.18.0"
          echo "Downloading musl Node v${NODE_VER}..."
          curl -fsSL "https://unofficial-builds.nodejs.org/download/release/v${NODE_VER}/node-v${NODE_VER}-linux-arm64-musl.tar.xz" -o node.tar.xz
          tar -xJf node.tar.xz
          mv node-v${NODE_VER}-linux-arm64-musl/bin/node node/bin/node.bin
          chmod +x node/bin/node.bin
          rm -rf node-v* node.tar.xz

          # 3. Download Alpine musl dynamic loader and C++ runtime
          ALPINE_MIRROR="https://dl-cdn.alpinelinux.org/alpine/latest-stable/main/aarch64"
          curl -fsSL "${ALPINE_MIRROR}/musl-1.2.6-r2.apk" -o musl.apk
          tar -xzf musl.apk lib/ld-musl-aarch64.so.1 lib/libc.musl-aarch64.so.1
          mv lib/* node/lib/
          rm -rf lib musl.apk

      - name: Package Magisk/KernelSU Zip
        run: |
          # 资产名必须是【短版本号】:v2.0.7 / v2.0.8 两个既有 Release 都用
          # OpenBox-Android-SukiSU-v2.0.8.zip 这种名字,update.json 的 zipUrl 也按它写。
          # 而 tag 名带 -coloros-ready 后缀 —— 直接拿 GITHUB_REF_NAME 会得出
          # OpenBox-Android-SukiSU-v2.0.9-coloros-ready.zip,和 update.json 对不上,
          # 手机端 OTA 会 404。这里显式去掉后缀。
          TAG="${GITHUB_REF_NAME:-v2.0.9}"
          VERSION="${TAG%%-*}"
          ZIP_NAME="OpenBox-Android-SukiSU-${VERSION}.zip"
          echo "tag=${TAG} -> version=${VERSION} -> asset=${ZIP_NAME}"
          zip -r "${ZIP_NAME}" * -x ".git*" ".github*" "*.tar.gz" "*.apk"

          # 硬校验:update.json 里声明的 zipUrl 文件名必须和刚打出来的包名逐字一致,
          # 否则 SukiSU / KernelSU 的 OTA 会拿到一个不存在的下载地址(404)。
          # 这类不一致过去只能等用户报「更新失败」才发现,现在直接让流水线失败。
          DECLARED="$(basename "$(sed -n 's/.*"zipUrl"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' update.json)")"
          echo "declared in update.json = ${DECLARED}"
          if [ "${DECLARED}" != "${ZIP_NAME}" ]; then
            echo "::error::打包名与 update.json 的 zipUrl 不一致:产出 ${ZIP_NAME},声明 ${DECLARED};手机端 OTA 会 404"
            exit 1
          fi
          echo "打包名与 update.json 一致:${ZIP_NAME}"
          ls -lh "${ZIP_NAME}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "OpenBox for Android ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            OpenBox-Android-SukiSU-*.zip
